[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-ai"
version = "0.1.0"
description = "Indoor metric floor-plan reconstruction project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "floorplan-ai contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.0,<3",
  "numpy>=1.26,<2",
  "opencv-python",
  "open3d>=0.18,<0.20",
  "scipy>=1.11,<1.14",
  "scikit-learn>=1.4,<1.6",
  "Pillow",
  "shapely",
  "ezdxf",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
floorplan-ai = "floorplan_ai.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
